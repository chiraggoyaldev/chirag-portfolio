<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Terminal prompt mark. Drawn with geometry rather than text so it never
       depends on a font being available, and stays legible at 16px. -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#262626" />
  <path
    d="M8.5 9.5 L15.5 16 L8.5 22.5"
    fill="none"
    stroke="#4ade80"
    stroke-width="3.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="17.5" y="19.2" width="7.5" height="3.4" rx="1.4" fill="#4ade80" />
</svg>
